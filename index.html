  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
    body{background:#0a0a0a;color:#fff}
    
    .container{max-width:1000px;margin:auto;padding:30px 15px}
    h1{text-align:center;font-size:24px;margin-bottom:25px;font-weight:600;letter-spacing:1px}
    
    /* GALLERY GRID */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .card{background:#111;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;transition:0.3s}
    .card:hover{transform:scale(1.03)}
    .card img{width:100%;height:250px;object-fit:cover;display:block}
    
    /* RED PLAY BUTTON */
    .play-btn{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      width:60px;
      height:60px;
      background:#ff0000;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 15px rgba(255,0,0,0.6);
      transition:0.3s;
      pointer-events:none;
    }
    .play-btn::after{
      content:"";
      border-left:18px solid #fff;
      border-top:12px solid transparent;
      border-bottom:12px solid transparent;
      margin-left:4px;
    }
    .card:hover .play-btn{
      transform:translate(-50%,-50%) scale(1.1);
      background:#ff3333;
    }

    .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.7));padding:10px;font-size:13px;opacity:0;transition:0.3s}
    .card:hover .overlay{opacity:1}

    @media(max-width:800px){
      .grid{grid-template-columns:repeat(2,1fr)} 
      .card img{height:200px} 
      .play-btn{width:50px; height:50px}
    }
    @media(max-width:500px){
      .grid{grid-template-columns:repeat(1,1fr)} 
      .card img{height:220px}
    }
  </style>
